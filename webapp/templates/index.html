<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlphaZero Arena Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="stage-bg" aria-hidden="true"></div>
    <div class="app-shell">
        <header class="hero panel">
            <p class="hero-kicker">Self-Play Monitor</p>
            <h1 class="hero-title">AlphaZero Arena Console</h1>
            <p class="hero-subtitle">Go / Gomoku interactive board, policy heatmap, and quick control loop.</p>
        </header>

        <section class="panel controls">
            <div class="control-grid">
                <label class="field">
                    <span>游戏</span>
                    <select id="gameSelect"></select>
                </label>

                <label class="field">
                    <span>模式</span>
                    <select id="modeSelect">
                        <option value="human_ai">人机对战</option>
                        <option value="human_human">人人对战</option>
                        <option value="ai_ai">机机对战</option>
                    </select>
                </label>

                <label class="field">
                    <span>执子</span>
                    <select id="humanColor">
                        <option value="1">黑方</option>
                        <option value="-1">白方</option>
                    </select>
                </label>

                <label class="field">
                    <span>MCTS 模拟数</span>
                    <input id="simsInput" type="number" min="1" value="100" />
                </label>

                <label class="field">
                    <span>模型</span>
                    <select id="modelSelect"></select>
                </label>

                <label class="field">
                    <span>策略热力</span>
                    <select id="showProb">
                        <option value="1">显示</option>
                        <option value="0">隐藏</option>
                    </select>
                </label>
            </div>

            <div class="action-row">
                <button id="startBtn" class="btn btn-primary">开始 / 重开</button>
                <button id="undoBtn" class="btn">悔棋</button>
                <button id="passBtn" class="btn btn-warn">PASS</button>
                <button id="aiStepBtn" class="btn">AI 下一步</button>
                <button id="analyzeBtn" class="btn btn-ghost">分析局面</button>
            </div>

            <div id="status" class="status-line" aria-live="polite"></div>
        </section>

        <main class="workspace">
            <section class="panel board-panel">
                <div class="board-head">
                    <div>
                        <h2>棋盘</h2>
                        <p id="boardHint">点击落子；Go 支持 PASS。</p>
                    </div>
                </div>
                <div id="boardRoot" class="board-root"></div>
            </section>

            <aside class="panel side-panel">
                <h2>对局信息</h2>
                <div class="meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">当前游戏</span>
                        <strong id="metaGame">-</strong>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">当前走子</span>
                        <strong id="metaTurn">-</strong>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">模型</span>
                        <strong id="metaModel">-</strong>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">PASS 概率</span>
                        <strong id="metaPassProb">-</strong>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">最新价值</span>
                        <strong id="metaValue">-</strong>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">结果</span>
                        <strong id="metaWinner">进行中</strong>
                    </div>
                </div>

                <div class="history-wrap">
                    <h3>走子记录</h3>
                    <ol id="historyList" class="history"></ol>
                </div>
            </aside>
        </main>
    </div>

    <script>
        const state = {
            game: null,
            size: 0,
            columns: [],
            passSupported: false,
            board: [],
            policy: [],
            passProb: 0,
            history: [],
            currentPlayer: 1,
            winner: null,
            model: "-",
            mode: "human_ai",
            humanPlayer: 1,
            valueCurve: [],
            busy: false,
        };

        const el = {
            status: document.getElementById("status"),
            boardRoot: document.getElementById("boardRoot"),
            boardHint: document.getElementById("boardHint"),
            gameSelect: document.getElementById("gameSelect"),
            modeSelect: document.getElementById("modeSelect"),
            humanColor: document.getElementById("humanColor"),
            simsInput: document.getElementById("simsInput"),
            modelSelect: document.getElementById("modelSelect"),
            showProb: document.getElementById("showProb"),
            startBtn: document.getElementById("startBtn"),
            undoBtn: document.getElementById("undoBtn"),
            passBtn: document.getElementById("passBtn"),
            aiStepBtn: document.getElementById("aiStepBtn"),
            analyzeBtn: document.getElementById("analyzeBtn"),
            historyList: document.getElementById("historyList"),
            metaGame: document.getElementById("metaGame"),
            metaTurn: document.getElementById("metaTurn"),
            metaModel: document.getElementById("metaModel"),
            metaPassProb: document.getElementById("metaPassProb"),
            metaValue: document.getElementById("metaValue"),
            metaWinner: document.getElementById("metaWinner"),
        };

        function parsePositiveInt(raw) {
            if (raw === null || raw === undefined) {
                return null;
            }
            const text = String(raw).trim();
            if (!text) {
                return null;
            }
            const value = Number(text);
            if (!Number.isFinite(value) || value <= 0) {
                return null;
            }
            return Math.floor(value);
        }

        function setBusy(flag) {
            state.busy = flag;
            [
                el.startBtn,
                el.undoBtn,
                el.passBtn,
                el.aiStepBtn,
                el.analyzeBtn,
                el.gameSelect,
                el.modeSelect,
                el.humanColor,
                el.simsInput,
                el.modelSelect,
                el.showProb,
            ].forEach((node) => {
                node.disabled = flag;
            });
        }

        function setStatus(message, isError = false) {
            el.status.textContent = message || "";
            el.status.classList.toggle("error", Boolean(isError));
        }

        async function requestJson(url, options = {}) {
            const init = {
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                },
                ...options,
            };
            const response = await fetch(url, init);
            const text = await response.text();
            let payload = {};

            if (text) {
                try {
                    payload = JSON.parse(text);
                } catch (err) {
                    payload = { error: text };
                }
            }

            if (!response.ok) {
                throw new Error(payload.error || `${response.status} ${response.statusText}`);
            }

            return payload;
        }

        function playerText(player) {
            if (player === 1) return "黑方";
            if (player === -1) return "白方";
            return String(player);
        }

        function winnerText(winner) {
            if (winner === null || winner === undefined) return "进行中";
            if (winner === 0) return "平局";
            return winner === 1 ? "黑方胜" : "白方胜";
        }

        function updateModeControls() {
            const mode = state.mode || el.modeSelect.value;
            const aiMode = mode === "ai_ai";
            const humanMode = mode !== "ai_ai";
            el.aiStepBtn.style.display = aiMode ? "inline-flex" : "none";
            el.humanColor.disabled = !humanMode || state.busy;
        }

        function applyPayload(data) {
            state.game = data.game;
            state.size = data.size;
            state.columns = data.columns || [];
            state.passSupported = Boolean(data.pass_supported);
            state.board = data.board || [];
            state.policy = data.policy || [];
            state.passProb = Number(data.pass_prob || 0);
            state.history = data.history || [];
            state.currentPlayer = data.current_player;
            state.winner = data.winner;
            state.model = data.model || "random(init)";
            state.mode = data.mode || el.modeSelect.value;
            state.humanPlayer = data.human_player ?? parseInt(el.humanColor.value, 10);
            state.valueCurve = data.value_curve || [];

            el.modeSelect.value = state.mode;
            el.humanColor.value = String(state.humanPlayer);

            renderBoard();
            renderHistory();
            renderMeta();
        }

        function renderMeta() {
            el.metaGame.textContent = state.game || "-";
            el.metaTurn.textContent = playerText(state.currentPlayer);
            el.metaModel.textContent = state.model || "-";
            el.metaPassProb.textContent = state.passSupported ? `${(state.passProb * 100).toFixed(2)}%` : "N/A";
            const latestValue = state.valueCurve.length ? state.valueCurve[state.valueCurve.length - 1] : 0;
            el.metaValue.textContent = Number(latestValue).toFixed(4);
            el.metaWinner.textContent = winnerText(state.winner);

            el.passBtn.style.display = state.passSupported ? "inline-flex" : "none";
            el.boardHint.textContent = state.passSupported
                ? "点击棋盘落子；Go 支持 PASS。"
                : "点击棋盘落子。";
            updateModeControls();
        }

        function renderHistory() {
            el.historyList.innerHTML = "";
            state.history.forEach((move, index) => {
                const li = document.createElement("li");
                li.textContent = `${index + 1}. ${move}`;
                el.historyList.appendChild(li);
            });
        }

        function shouldAcceptHumanClick() {
            if (state.busy || state.winner !== null) return false;
            const mode = state.mode || el.modeSelect.value;
            if (mode === "human_human") return true;
            if (mode === "human_ai") return state.currentPlayer === parseInt(el.humanColor.value, 10);
            return false;
        }

        function renderBoard() {
            if (!state.board || state.board.length === 0) {
                el.boardRoot.innerHTML = '<div class="empty-board">暂无棋盘</div>';
                return;
            }

            const showProb = el.showProb.value === "1";
            let best = { x: -1, y: -1, p: -1 };
            for (let x = 0; x < state.size; x++) {
                for (let y = 0; y < state.size; y++) {
                    if (state.board[x][y] !== 0) continue;
                    const p = (state.policy[x] && state.policy[x][y]) ? state.policy[x][y] : 0;
                    if (p > best.p) best = { x, y, p };
                }
            }

            const table = document.createElement("table");
            table.className = "board";

            const headRow = document.createElement("tr");
            const corner = document.createElement("th");
            corner.textContent = "";
            corner.className = "corner";
            headRow.appendChild(corner);

            for (let y = 0; y < state.size; y++) {
                const th = document.createElement("th");
                th.textContent = state.columns[y] || String(y + 1);
                headRow.appendChild(th);
            }
            table.appendChild(headRow);

            for (let x = 0; x < state.size; x++) {
                const tr = document.createElement("tr");
                const rowTh = document.createElement("th");
                rowTh.textContent = state.game === "go" ? String(state.size - x) : String(x + 1);
                tr.appendChild(rowTh);

                for (let y = 0; y < state.size; y++) {
                    const td = document.createElement("td");
                    const stoneValue = state.board[x][y];

                    if (stoneValue === 0) td.classList.add("empty");
                    if (x === best.x && y === best.y && best.p > 0) td.classList.add("best");

                    if (stoneValue === 1 || stoneValue === -1) {
                        const stone = document.createElement("span");
                        stone.className = `stone ${stoneValue === 1 ? "black" : "white"}`;
                        stone.textContent = "●";
                        td.appendChild(stone);
                    } else if (showProb) {
                        const p = (state.policy[x] && state.policy[x][y]) ? state.policy[x][y] : 0;
                        if (p > 0.005) {
                            const prob = document.createElement("span");
                            prob.className = "prob";
                            prob.textContent = `${(p * 100).toFixed(1)}%`;
                            td.appendChild(prob);
                        }
                    }

                    td.addEventListener("click", () => onCellClick(x, y));
                    tr.appendChild(td);
                }

                table.appendChild(tr);
            }

            el.boardRoot.innerHTML = "";
            el.boardRoot.appendChild(table);
        }

        async function loadGames() {
            const payload = await requestJson("/games");
            el.gameSelect.innerHTML = "";
            (payload.games || []).forEach((gameName) => {
                const opt = document.createElement("option");
                opt.value = gameName;
                opt.textContent = gameName;
                if (gameName === payload.current) opt.selected = true;
                el.gameSelect.appendChild(opt);
            });
        }

        async function loadModels(gameName) {
            const payload = await requestJson(`/models?game=${encodeURIComponent(gameName)}`);
            el.modelSelect.innerHTML = "";

            const latest = document.createElement("option");
            latest.value = "latest";
            latest.textContent = "latest";
            el.modelSelect.appendChild(latest);

            const randomOpt = document.createElement("option");
            randomOpt.value = "random";
            randomOpt.textContent = "random(init)";
            el.modelSelect.appendChild(randomOpt);

            (payload.models || []).forEach((modelName) => {
                const opt = document.createElement("option");
                opt.value = modelName;
                opt.textContent = modelName;
                if (modelName === payload.current) opt.selected = true;
                el.modelSelect.appendChild(opt);
            });

            if (!payload.models || payload.models.length === 0) {
                el.modelSelect.value = "random";
            }
        }

        async function startGame() {
            setBusy(true);
            setStatus("正在启动...");
            try {
                const sims = parsePositiveInt(el.simsInput.value);
                const payload = {
                    game: el.gameSelect.value,
                    mode: el.modeSelect.value,
                    human_player: parseInt(el.humanColor.value, 10),
                    model: el.modelSelect.value,
                };
                if (sims !== null) {
                    payload.mcts_sims = sims;
                }

                const data = await requestJson("/start", {
                    method: "POST",
                    body: JSON.stringify(payload),
                });
                applyPayload(data);
                setStatus("已启动");
            } catch (err) {
                setStatus(err.message || "启动失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function onCellClick(x, y) {
            if (!shouldAcceptHumanClick()) return;
            setBusy(true);
            setStatus("落子中...");
            try {
                const payload = await requestJson("/move", {
                    method: "POST",
                    body: JSON.stringify({ x, y }),
                });
                applyPayload(payload);
                setStatus("");
            } catch (err) {
                setStatus(err.message || "落子失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function passMove() {
            if (!state.passSupported || !shouldAcceptHumanClick()) return;
            setBusy(true);
            setStatus("PASS...");
            try {
                const payload = await requestJson("/move", {
                    method: "POST",
                    body: JSON.stringify({ pass: true }),
                });
                applyPayload(payload);
                setStatus("");
            } catch (err) {
                setStatus(err.message || "PASS 失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function undoMove() {
            setBusy(true);
            setStatus("悔棋中...");
            try {
                const payload = await requestJson("/undo", {
                    method: "POST",
                    body: JSON.stringify({}),
                });
                applyPayload(payload);
                setStatus("");
            } catch (err) {
                setStatus(err.message || "悔棋失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function aiStep() {
            setBusy(true);
            setStatus("AI 思考中...");
            try {
                const payload = await requestJson("/ai_step", {
                    method: "POST",
                    body: JSON.stringify({}),
                });
                applyPayload(payload);
                setStatus("");
            } catch (err) {
                setStatus(err.message || "AI 下一步失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function analyze() {
            setBusy(true);
            setStatus("分析中...");
            try {
                const sims = parsePositiveInt(el.simsInput.value);
                const body = {};
                if (sims !== null) {
                    body.sims = sims;
                }

                const payload = await requestJson("/analyze", {
                    method: "POST",
                    body: JSON.stringify(body),
                });

                state.policy = payload.policy || state.policy;
                state.passProb = Number(payload.pass_prob || 0);
                renderBoard();
                renderMeta();
                setStatus(`分析价值: ${Number(payload.value || 0).toFixed(4)}`);
            } catch (err) {
                setStatus(err.message || "分析失败", true);
            } finally {
                setBusy(false);
            }
        }

        async function onGameChange() {
            await loadModels(el.gameSelect.value);
        }

        function attachEvents() {
            el.startBtn.addEventListener("click", startGame);
            el.undoBtn.addEventListener("click", undoMove);
            el.passBtn.addEventListener("click", passMove);
            el.aiStepBtn.addEventListener("click", aiStep);
            el.analyzeBtn.addEventListener("click", analyze);
            el.gameSelect.addEventListener("change", onGameChange);
            el.modeSelect.addEventListener("change", updateModeControls);
            el.showProb.addEventListener("change", renderBoard);
        }

        async function bootstrap() {
            attachEvents();
            await loadGames();
            await loadModels(el.gameSelect.value);
            await startGame();
        }

        bootstrap().catch((err) => {
            setStatus(err.message || "初始化失败", true);
        });
    </script>
</body>
</html>
