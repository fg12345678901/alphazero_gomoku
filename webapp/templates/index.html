<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d4ff">
    <title>AlphaZero 五子棋</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <div class="main-container">
        <!-- 标题 -->
        <div class="header">
            <h1 class="main-title">AlphaZero Gomoku</h1>
            <div class="subtitle">Mastering the game of Gomoku without human knowledge</div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label">游戏模式</label>
                    <select id="mode" class="futuristic-select">
                        <option value="human_ai">人机对战</option>
                        <option value="human_human">人人对战</option>
                        <option value="ai_ai">机机对战</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">执黑方</label>
                    <select id="human_color" class="futuristic-select">
                        <option value="1">玩家</option>
                        <option value="-1">AI</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">搜索深度</label>
                    <input id="sims" type="number" value="600" class="futuristic-input">
                </div>

                <div class="control-group">
                    <label class="control-label">AI 模型</label>
                    <select id="modelSelect" class="futuristic-select"></select>
                </div>

                <div class="control-group">
                    <label class="control-label">显示选项</label>
                    <label class="futuristic-checkbox">
                        <input type="checkbox" id="show_prob" checked>
                        <span>显示概率</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">操作</label>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="startGame()" class="futuristic-btn btn-success">开始</button>
                        <button onclick="undo()" class="futuristic-btn">悔棋</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">高级</label>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="openAnalyzeModal()" class="futuristic-btn">深度分析</button>
                        <button onclick="downloadBoard()" class="futuristic-btn">下载棋盘</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-container">
            <!-- 棋盘 -->
            <div class="board-wrapper">
                <div id="board"></div>
            </div>

            <!-- 侧边面板 -->
            <div class="side-panel">
                <!-- 状态显示 -->
                <div class="status-display">
                    <div class="scoreboard">
                        <div class="player-score" id="blackPlayer">
                            <div class="player-name">黑方</div>
                            <div class="score" id="blackCount">0</div>
                        </div>
                        <div class="player-score" id="whitePlayer">
                            <div class="player-name">白方</div>
                            <div class="score" id="whiteCount">0</div>
                        </div>
                    </div>
                    <div id="status"></div>
                    <div id="currentModel" style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 10px;"></div>
                </div>

                <!-- AI 评估 -->
                <div class="data-panel">
                    <h3 class="panel-title">AI 价值评估</h3>
                    <div id="values" style="color: var(--primary-cyan); font-family: 'Orbitron', monospace;"></div>
                    <div class="chart-container">
                        <canvas id="valueChart"></canvas>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="data-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 class="panel-title" style="margin: 0;">走子记录</h3>
                        <button onclick="copyHistory()" class="futuristic-btn" style="padding: 5px 15px; font-size: 0.8rem;">复制</button>
                    </div>
                    <div class="history-container">
                        <ol id="historyList"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 深度分析模态框 -->
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <div id="analyzeModal" class="modal">
        <h3>深度分析设置</h3>
        <div class="control-group">
            <label class="control-label">搜索次数</label>
            <input id="analyzeSims" type="number" min="1" class="futuristic-input">
        </div>
        <div class="modal-actions">
            <button id="analyzeCancel" class="futuristic-btn btn-danger">取消</button>
            <button id="analyzeConfirm" class="futuristic-btn btn-success">确定</button>
        </div>
    </div>

    <!-- 引入依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // 创建粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // 原有的JavaScript代码保持不变，只需要替换相关的DOM选择器和类名
        let size = 15; // 默认大小，实际从服务器获取
        let boardElem = document.getElementById('board');
        let valuesElem = document.getElementById('values');
        let policy = null;
        let currentBoard = null;
        let currentPlayer = 1;
        let awaitingAi = false;
        let gameOver = false;
        let moveHistory = [];
        let chart = null;
        let analysisPoints = [];

        // 胜利庆祝效果增强
        function celebrate(winner) {
            const colors = winner === 1 ? ['#a855f7', '#ec4899'] :
                            winner === -1 ? ['#00d4ff', '#3b82f6'] : ['#888', '#ccc'];

            // 多次发射彩带
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: colors,
                        gravity: 0.8,
                        scalar: 1.2
                    });
                }, i * 200);
            }

            // 添加全屏闪光效果
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: ${winner === 1 ? 'rgba(168, 85, 247, 0.3)' : 'rgba(0, 212, 255, 0.3)'};
                z-index: 9999;
                pointer-events: none;
                animation: flash 0.5s ease-out;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        // 以下JavaScript代码与原版基本相同，只是适配了新的样式类名
        // ... [继续原有的JavaScript逻辑，保持功能不变] ...

        function updateHistory() {
            const list = document.getElementById('historyList');
            if (!list) return;
            list.innerHTML = '';
            moveHistory.forEach((m, idx) => {
                const x = Math.floor(m / size) + 1;
                const y = m % size + 1;
                const li = document.createElement('li');
                li.textContent = `${idx+1}:(${x},${y})`;
                list.appendChild(li);
            });
        }

        function updateScoreboard() {
            if (!currentBoard) {
                document.getElementById('blackCount').textContent = '0';
                document.getElementById('whiteCount').textContent = '0';
            } else {
                let black = 0, white = 0;
                for (let i=0;i<size;i++) {
                    for (let j=0;j<size;j++) {
                        if (currentBoard[i][j] === 1) black++;
                        else if (currentBoard[i][j] === -1) white++;
                    }
                }
                document.getElementById('blackCount').textContent = black;
                document.getElementById('whiteCount').textContent = white;
            }
            document.getElementById('blackPlayer').classList.toggle('active', currentPlayer === 1);
            document.getElementById('whitePlayer').classList.toggle('active', currentPlayer === -1);
        }

        function copyHistory() {
            const text = moveHistory.map((m, idx) => {
                const x = Math.floor(m / size) + 1;
                const y = m % size + 1;
                return `${idx + 1}.(${x},${y})`;
            }).join(' ');
            navigator.clipboard.writeText(text);

            // 添加复制成功提示
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '已复制!';
            btn.style.background = 'linear-gradient(135deg, var(--success), var(--primary-cyan))';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }

        function downloadBoard() {
            html2canvas(document.getElementById('board')).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'alphazero-gomoku-board.png';
                link.click();
            });
        }

        function describeAdvantage(v) {
            const advantage = Math.abs(v);
            const level = advantage > 0.7 ? '绝对' : advantage > 0.4 ? '明显' : advantage > 0.2 ? '略有' : '';
            if (v > 0.1) return `⚫ 黑方${level}优势 (${(v*100).toFixed(1)}%)`;
            if (v < -0.1) return `⚪ 白方${level}优势 (${(Math.abs(v)*100).toFixed(1)}%)`;
            return '⚖️ 势均力敌';
        }

        function loadModels() {
            axios.get('/models').then(res => {
                const sel = document.getElementById('modelSelect');
                sel.innerHTML = '';
                res.data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (m === res.data.current) opt.selected = true;
                    sel.appendChild(opt);
                });
                document.getElementById('currentModel').textContent = res.data.current ? `当前模型: ${res.data.current}` : '';
            });
        }

        function initChart() {
            const ctx = document.getElementById('valueChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '胜率估计',
                        data: [],
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }, {
                        label: '搜索评估',
                        data: [],
                        borderColor: '#ec4899',
                        backgroundColor: '#fff',
                        pointBorderColor: '#ec4899',
                        pointBackgroundColor: '#fff',
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        borderWidth: 2,
                        showLine: false
                    }]
                },
                options: {
                    scales: {
                        y: {
                            min: -1,
                            max: 1,
                            grid: {
                                color: 'rgba(0, 212, 255, 0.1)',
                                borderColor: 'rgba(0, 212, 255, 0.3)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0, 212, 255, 0.1)',
                                borderColor: 'rgba(0, 212, 255, 0.3)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.getElementById('show_prob').addEventListener('change', () => {
            if(currentBoard) renderBoard(currentBoard, policy);
        });

        function renderBoard(board, probs) {
            currentBoard = board;
            let showProb = document.getElementById('show_prob').checked;
            let html = '<table class="board"><tr><th></th>';
            for (let j=0;j<size;j++) html += `<th>${j+1}</th>`;
            html += '</tr>';

            let best = {x:-1,y:-1,p:0};
            let maxProb = 0;
            if (probs) {
                for (let i=0;i<size;i++) {
                    for (let j=0;j<size;j++) {
                        if (board[i][j]===0) {
                            if (probs[i][j] > best.p) best = {x:i,y:j,p:probs[i][j]};
                            if (probs[i][j] > maxProb) maxProb = probs[i][j];
                        }
                    }
                }
            }

            const moveNumbers = {};
            let lastBlack = null, lastWhite = null;
            moveHistory.forEach((m, idx) => {
                const x = Math.floor(m / size);
                const y = m % size;
                moveNumbers[`${x},${y}`] = idx + 1;
                if (idx % 2 === 0) lastBlack = {x, y};
                else lastWhite = {x, y};
            });

            for (let i=0;i<size;i++) {
                html += `<tr><th>${i+1}</th>`;
                for (let j=0;j<size;j++) {
                    let v = board[i][j];
                    let probText = '';
                    let style = '';

                    if (v===0 && probs && showProb) {
                        let p = probs[i][j];
                        if (p > 0.01) {
                            probText = `<span class="prob">${(p*100).toFixed(1)}</span>`;
                            let ratio = maxProb ? p / maxProb : 0;
                            if (i===best.x && j===best.y) {
                                // Best move handled by class
                            } else if (p > 0) {
                                let opacity = 0.1 + (0.3 * ratio);
                                style = `background: rgba(0, 212, 255, ${opacity});`;
                            }
                        }
                    }

                    let cls = '';
                    if (v===1) cls += ' black';
                    if (v===-1) cls += ' white';
                    if (i===lastBlack?.x && j===lastBlack?.y) cls += ' last-black';
                    if (i===lastWhite?.x && j===lastWhite?.y) cls += ' last-white';
                    if (i===best.x && j===best.y && probs) cls += ' best-move';

                    let num = moveNumbers[`${i},${j}`];
                    let numHtml = num?`<span class="move-num">${num}</span>`:'';

                    html += `<td class="${cls.trim()}" style="${style}" data-x="${i}" data-y="${j}">${numHtml}${probText}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            boardElem.innerHTML = html;

            document.querySelectorAll('#board td').forEach(td => {
                td.addEventListener('click', () => {
                    move(td.dataset.x, td.dataset.y);
                });
            });

            updateScoreboard();
        }

        function updateChart(values) {
            if (!chart) return;
            chart.data.labels = values.map((_, i) => i);
            chart.data.datasets[0].data = values;
            chart.data.datasets[1].data = analysisPoints.filter(p => p.x < values.length);
            chart.update();
        }

        function startGame() {
            document.getElementById('status').innerHTML = '<div class="loading"></div> 初始化引擎...';
            const loadingTip = setTimeout(() => {
                document.getElementById('status').innerHTML = '<div class="loading"></div> 加载神经网络模型...';
            }, 1000);

            axios.post('/start', {
                mode: document.getElementById('mode').value,
                human_player: document.getElementById('human_color').value,
                mcts_sims: document.getElementById('sims').value,
                model: document.getElementById('modelSelect').value
            }).then(res => {
                clearTimeout(loadingTip);
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                gameOver = false;
                analysisPoints = [];
                document.getElementById('status').textContent = '';
                document.getElementById('currentModel').textContent = res.data.model ? `当前模型: ${res.data.model}` : '';
                renderBoard(res.data.board, policy);
                const last = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(last);
                updateChart(res.data.value_curve);
                updateHistory();
                updateScoreboard();
                if (document.getElementById('mode').value === 'ai_ai') {
                    setTimeout(autoPlay, 500);
                }
            });
        }

        function autoPlay() {
            if (gameOver || awaitingAi || document.getElementById('mode').value !== 'ai_ai') return;
            awaitingAi = true;
            axios.post('/ai_step').then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const v = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(v);
                updateChart(res.data.value_curve);
                awaitingAi = false;
                if (res.data.winner !== null) {
                    gameOver = true;
                    let msg = res.data.winner===1?'⚫ 黑方胜利!':(res.data.winner===-1?'⚪ 白方胜利!':'⚖️ 平局!');
                    document.getElementById('status').innerHTML = `<div class="victory-message">${msg}</div><button onclick="resetPage()" class="futuristic-btn btn-success" style="margin-top: 20px;">再来一局</button>`;
                    celebrate(res.data.winner);
                } else {
                    setTimeout(autoPlay, 500);
                }
            }).catch(err => {
                awaitingAi = false;
                if (err.response) alert(err.response.data.error);
            });
        }

        function openAnalyzeModal() {
            if (!currentBoard || awaitingAi) return;
            document.getElementById('analyzeSims').value = document.getElementById('sims').value;
            document.getElementById('analyzeModal').style.display = 'block';
            document.getElementById('modalBackdrop').style.display = 'block';
        }

        function closeAnalyzeModal() {
            document.getElementById('analyzeModal').style.display = 'none';
            document.getElementById('modalBackdrop').style.display = 'none';
        }

        function performAnalyze(sims) {
            document.getElementById('status').innerHTML = '<div class="loading"></div> 深度分析中...';
            axios.post('/analyze', {sims: sims}).then(res => {
                policy = res.data.policy;
                renderBoard(currentBoard, policy);
                const idx = chart.data.datasets[0].data.length - 1;
                analysisPoints.push({x: idx, y: res.data.value});
                chart.data.datasets[1].data = analysisPoints;
                chart.update();
                document.getElementById('status').textContent = '';
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
                document.getElementById('status').textContent = '';
            });
        }

        function move(x, y) {
            if (gameOver || awaitingAi || currentBoard[x][y] !== 0) return;
            currentBoard[x][y] = currentPlayer;
            currentPlayer = -currentPlayer;
            moveHistory.push(x*size + y);
            renderBoard(currentBoard, policy);
            updateHistory();
            updateScoreboard();
            awaitingAi = true;

            // 先获取先验概率用于展示
            axios.post('/prior', {x: x, y: y}).then(res => {
                if(awaitingAi) {
                    policy = res.data.policy;
                    renderBoard(currentBoard, policy);
                }
            });

            document.getElementById('status').innerHTML = '<div class="loading"></div> AI 计算中...';
            axios.post('/move', {x: x, y: y}).then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const lastMoveVal = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(lastMoveVal);
                updateChart(res.data.value_curve);
                document.getElementById('status').textContent = '';
                awaitingAi = false;
                if (res.data.winner !== null) {
                    gameOver = true;
                    let msg = res.data.winner===1?'⚫ 黑方胜利!':(res.data.winner===-1?'⚪ 白方胜利!':'⚖️ 平局!');
                    document.getElementById('status').innerHTML = `<div class="victory-message">${msg}</div><button onclick="resetPage()" class="futuristic-btn btn-success" style="margin-top: 20px;">再来一局</button>`;
                    celebrate(res.data.winner);
                }
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
                document.getElementById('status').textContent = '';
                awaitingAi = false;
            });
        }

        function undo() {
            axios.post('/undo').then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const v = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(v);
                analysisPoints = analysisPoints.filter(p => p.x < res.data.value_curve.length);
                updateChart(res.data.value_curve);
                document.getElementById('status').textContent = '';
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
            });
        }

        function resetPage() {
            location.reload();
        }

        // 初始化
        initChart();
        updateHistory();
        updateScoreboard();
        loadModels();

        document.getElementById('analyzeConfirm').addEventListener('click', () => {
            const sims = document.getElementById('analyzeSims').value;
            closeAnalyzeModal();
            if (sims) performAnalyze(sims);
        });
        document.getElementById('analyzeCancel').addEventListener('click', closeAnalyzeModal);

        // 添加键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAnalyzeModal();
            if (e.ctrlKey && e.key === 'z') undo();
            if (e.ctrlKey && e.key === 's') startGame();
        });
    </script>
</body>
</html>
