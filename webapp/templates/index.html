<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlphaZero Web UI</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --line: #334155;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #06b6d4;
            --warn: #f59e0b;
            --black: #111827;
            --white: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            gap: 12px;
        }
        .panel {
            background: color-mix(in oklab, var(--panel) 94%, black 6%);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            align-items: end;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        select, input, button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #0b1220;
            color: var(--text);
        }
        button {
            cursor: pointer;
            background: #0b1220;
        }
        button.primary {
            border-color: #0ea5e9;
            background: #0c4a6e;
        }
        button.warn {
            border-color: #f59e0b;
            color: #fde68a;
        }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 12px;
        }
        .board-wrap {
            overflow: auto;
        }
        table.board {
            border-collapse: collapse;
            margin: 0 auto;
        }
        table.board th,
        table.board td {
            border: 1px solid var(--line);
            width: 36px;
            height: 36px;
            min-width: 36px;
            text-align: center;
            vertical-align: middle;
            position: relative;
        }
        table.board th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            background: #0b1220;
        }
        table.board td {
            background: #1f2937;
            user-select: none;
        }
        table.board td.empty { cursor: pointer; }
        table.board td.best {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }
        .stone {
            font-size: 20px;
            line-height: 1;
        }
        .stone.black { color: #111; text-shadow: 0 0 4px rgba(255,255,255,0.15); }
        .stone.white { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .prob {
            position: absolute;
            right: 2px;
            bottom: 2px;
            font-size: 10px;
            color: #7dd3fc;
            pointer-events: none;
        }
        .meta {
            display: grid;
            gap: 8px;
            font-size: 14px;
        }
        .meta .item { color: var(--muted); }
        .meta strong { color: var(--text); }
        .status {
            min-height: 22px;
            color: var(--accent);
            font-size: 14px;
        }
        .status.error { color: #fca5a5; }
        .history {
            max-height: 460px;
            overflow: auto;
            padding-left: 18px;
            margin: 0;
        }
        .history li {
            margin: 2px 0;
            font-size: 13px;
            color: #cbd5e1;
        }
        @media (max-width: 980px) {
            .main { grid-template-columns: 1fr; }
            table.board th,
            table.board td {
                width: 32px;
                height: 32px;
                min-width: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <div class="controls">
                <div>
                    <label for="gameSelect">游戏</label>
                    <select id="gameSelect"></select>
                </div>
                <div>
                    <label for="modeSelect">模式</label>
                    <select id="modeSelect">
                        <option value="human_ai">人机对战</option>
                        <option value="human_human">人人对战</option>
                        <option value="ai_ai">机机对战</option>
                    </select>
                </div>
                <div>
                    <label for="humanColor">执子</label>
                    <select id="humanColor">
                        <option value="1">黑方</option>
                        <option value="-1">白方</option>
                    </select>
                </div>
                <div>
                    <label for="simsInput">MCTS 模拟数</label>
                    <input id="simsInput" type="number" min="1" value="200" />
                </div>
                <div>
                    <label for="modelSelect">模型</label>
                    <select id="modelSelect"></select>
                </div>
                <div>
                    <label for="showProb">显示策略热力</label>
                    <select id="showProb">
                        <option value="1">开</option>
                        <option value="0">关</option>
                    </select>
                </div>
                <div>
                    <button id="startBtn" class="primary">开始/重开</button>
                </div>
                <div>
                    <button id="undoBtn">悔棋</button>
                </div>
                <div>
                    <button id="passBtn" class="warn">PASS</button>
                </div>
                <div>
                    <button id="aiStepBtn">AI 下一步</button>
                </div>
                <div>
                    <button id="analyzeBtn">分析当前局面</button>
                </div>
            </div>
            <div id="status" class="status"></div>
        </div>

        <div class="main">
            <div class="panel board-wrap">
                <div id="boardRoot"></div>
            </div>

            <div class="panel">
                <div class="meta">
                    <div class="item">当前游戏: <strong id="metaGame">-</strong></div>
                    <div class="item">当前走子: <strong id="metaTurn">-</strong></div>
                    <div class="item">模型: <strong id="metaModel">-</strong></div>
                    <div class="item">Go PASS 概率: <strong id="metaPassProb">-</strong></div>
                    <div class="item">最新价值: <strong id="metaValue">-</strong></div>
                    <div class="item">结果: <strong id="metaWinner">进行中</strong></div>
                </div>
                <hr style="border-color: var(--line); opacity: 0.5; margin: 12px 0;" />
                <h3 style="margin: 0 0 8px 0; font-size: 14px; color: var(--muted);">走子记录</h3>
                <ol id="historyList" class="history"></ol>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const state = {
            game: null,
            size: 0,
            columns: [],
            passSupported: false,
            board: [],
            policy: [],
            passProb: 0,
            history: [],
            currentPlayer: 1,
            winner: null,
            model: "-",
            mode: "human_ai",
            humanPlayer: 1,
            valueCurve: [],
            busy: false,
        };

        const el = {
            status: document.getElementById('status'),
            boardRoot: document.getElementById('boardRoot'),
            gameSelect: document.getElementById('gameSelect'),
            modeSelect: document.getElementById('modeSelect'),
            humanColor: document.getElementById('humanColor'),
            simsInput: document.getElementById('simsInput'),
            modelSelect: document.getElementById('modelSelect'),
            showProb: document.getElementById('showProb'),
            startBtn: document.getElementById('startBtn'),
            undoBtn: document.getElementById('undoBtn'),
            passBtn: document.getElementById('passBtn'),
            aiStepBtn: document.getElementById('aiStepBtn'),
            analyzeBtn: document.getElementById('analyzeBtn'),
            historyList: document.getElementById('historyList'),
            metaGame: document.getElementById('metaGame'),
            metaTurn: document.getElementById('metaTurn'),
            metaModel: document.getElementById('metaModel'),
            metaPassProb: document.getElementById('metaPassProb'),
            metaValue: document.getElementById('metaValue'),
            metaWinner: document.getElementById('metaWinner'),
        };

        function setBusy(flag) {
            state.busy = flag;
            [
                el.startBtn,
                el.undoBtn,
                el.passBtn,
                el.aiStepBtn,
                el.analyzeBtn,
                el.gameSelect,
                el.modeSelect,
                el.humanColor,
                el.simsInput,
                el.modelSelect,
            ].forEach(node => node.disabled = flag);
        }

        function setStatus(msg, isError = false) {
            el.status.textContent = msg || '';
            el.status.classList.toggle('error', Boolean(isError));
        }

        async function apiGet(url) {
            const res = await axios.get(url);
            return res.data;
        }

        async function apiPost(url, payload) {
            const res = await axios.post(url, payload || {});
            return res.data;
        }

        function playerText(player) {
            if (player === 1) return '黑方';
            if (player === -1) return '白方';
            return String(player);
        }

        function winnerText(winner) {
            if (winner === null || winner === undefined) return '进行中';
            if (winner === 0) return '平局';
            return winner === 1 ? '黑方胜' : '白方胜';
        }

        function applyPayload(data) {
            state.game = data.game;
            state.size = data.size;
            state.columns = data.columns || [];
            state.passSupported = Boolean(data.pass_supported);
            state.board = data.board || [];
            state.policy = data.policy || [];
            state.passProb = data.pass_prob || 0;
            state.history = data.history || [];
            state.currentPlayer = data.current_player;
            state.winner = data.winner;
            state.model = data.model || 'random(init)';
            state.mode = data.mode || el.modeSelect.value;
            state.humanPlayer = data.human_player ?? parseInt(el.humanColor.value, 10);
            state.valueCurve = data.value_curve || [];

            renderBoard();
            renderHistory();
            renderMeta();
        }

        function renderMeta() {
            el.metaGame.textContent = state.game || '-';
            el.metaTurn.textContent = playerText(state.currentPlayer);
            el.metaModel.textContent = state.model || '-';
            el.metaPassProb.textContent = state.passSupported ? (state.passProb * 100).toFixed(2) + '%' : 'N/A';
            const latestValue = state.valueCurve.length ? state.valueCurve[state.valueCurve.length - 1] : 0;
            el.metaValue.textContent = Number(latestValue).toFixed(4);
            el.metaWinner.textContent = winnerText(state.winner);

            el.passBtn.style.display = state.passSupported ? 'block' : 'none';
            el.aiStepBtn.style.display = (el.modeSelect.value === 'ai_ai') ? 'block' : 'none';
        }

        function renderHistory() {
            el.historyList.innerHTML = '';
            state.history.forEach((m, idx) => {
                const li = document.createElement('li');
                li.textContent = `${idx + 1}. ${m}`;
                el.historyList.appendChild(li);
            });
        }

        function shouldAcceptHumanClick() {
            if (state.busy || state.winner !== null) return false;
            const mode = el.modeSelect.value;
            if (mode === 'human_human') return true;
            if (mode === 'human_ai') return state.currentPlayer === parseInt(el.humanColor.value, 10);
            return false;
        }

        function renderBoard() {
            if (!state.board || !state.board.length) {
                el.boardRoot.innerHTML = '<div>暂无棋盘</div>';
                return;
            }

            const showProb = el.showProb.value === '1';
            let best = { x: -1, y: -1, p: -1 };
            for (let x = 0; x < state.size; x++) {
                for (let y = 0; y < state.size; y++) {
                    if (state.board[x][y] !== 0) continue;
                    const p = (state.policy[x] && state.policy[x][y]) ? state.policy[x][y] : 0;
                    if (p > best.p) best = { x, y, p };
                }
            }

            const table = document.createElement('table');
            table.className = 'board';

            const head = document.createElement('tr');
            const corner = document.createElement('th');
            corner.textContent = '';
            head.appendChild(corner);
            for (let y = 0; y < state.size; y++) {
                const th = document.createElement('th');
                th.textContent = state.columns[y] || String(y + 1);
                head.appendChild(th);
            }
            table.appendChild(head);

            for (let x = 0; x < state.size; x++) {
                const tr = document.createElement('tr');
                const rowTh = document.createElement('th');
                rowTh.textContent = state.game === 'go' ? String(state.size - x) : String(x + 1);
                tr.appendChild(rowTh);

                for (let y = 0; y < state.size; y++) {
                    const td = document.createElement('td');
                    const v = state.board[x][y];

                    if (v === 0) td.classList.add('empty');
                    if (x === best.x && y === best.y && best.p > 0) td.classList.add('best');

                    if (v === 1 || v === -1) {
                        const stone = document.createElement('span');
                        stone.className = `stone ${v === 1 ? 'black' : 'white'}`;
                        stone.textContent = v === 1 ? '●' : '○';
                        td.appendChild(stone);
                    } else if (showProb) {
                        const p = (state.policy[x] && state.policy[x][y]) ? state.policy[x][y] : 0;
                        if (p > 0.005) {
                            const prob = document.createElement('span');
                            prob.className = 'prob';
                            prob.textContent = (p * 100).toFixed(1);
                            td.appendChild(prob);
                        }
                    }

                    td.addEventListener('click', () => onCellClick(x, y));
                    tr.appendChild(td);
                }

                table.appendChild(tr);
            }

            el.boardRoot.innerHTML = '';
            el.boardRoot.appendChild(table);
        }

        async function loadGames() {
            const data = await apiGet('/games');
            el.gameSelect.innerHTML = '';
            (data.games || []).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                if (g === data.current) opt.selected = true;
                el.gameSelect.appendChild(opt);
            });
        }

        async function loadModels(gameName) {
            const data = await apiGet(`/models?game=${encodeURIComponent(gameName)}`);
            el.modelSelect.innerHTML = '';

            const latest = document.createElement('option');
            latest.value = 'latest';
            latest.textContent = 'latest';
            el.modelSelect.appendChild(latest);

            const randomOpt = document.createElement('option');
            randomOpt.value = 'random';
            randomOpt.textContent = 'random(init)';
            el.modelSelect.appendChild(randomOpt);

            (data.models || []).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === data.current) opt.selected = true;
                el.modelSelect.appendChild(opt);
            });

            if (!data.models || data.models.length === 0) {
                el.modelSelect.value = 'random';
            }
        }

        async function startGame() {
            setBusy(true);
            setStatus('正在启动...');
            try {
                const payload = await apiPost('/start', {
                    game: el.gameSelect.value,
                    mode: el.modeSelect.value,
                    human_player: parseInt(el.humanColor.value, 10),
                    mcts_sims: parseInt(el.simsInput.value, 10),
                    model: el.modelSelect.value,
                });
                applyPayload(payload);
                setStatus('已启动');
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function onCellClick(x, y) {
            if (!shouldAcceptHumanClick()) return;
            setBusy(true);
            setStatus('落子中...');
            try {
                const payload = await apiPost('/move', { x, y });
                applyPayload(payload);
                setStatus('');
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function passMove() {
            if (!state.passSupported || !shouldAcceptHumanClick()) return;
            setBusy(true);
            setStatus('PASS...');
            try {
                const payload = await apiPost('/move', { pass: true });
                applyPayload(payload);
                setStatus('');
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function undoMove() {
            setBusy(true);
            setStatus('悔棋中...');
            try {
                const payload = await apiPost('/undo', {});
                applyPayload(payload);
                setStatus('');
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function aiStep() {
            setBusy(true);
            setStatus('AI 思考中...');
            try {
                const payload = await apiPost('/ai_step', {});
                applyPayload(payload);
                setStatus('');
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function analyze() {
            setBusy(true);
            setStatus('分析中...');
            try {
                const res = await apiPost('/analyze', { sims: parseInt(el.simsInput.value, 10) });
                state.policy = res.policy || state.policy;
                state.passProb = res.pass_prob || 0;
                renderBoard();
                renderMeta();
                setStatus(`分析价值: ${Number(res.value || 0).toFixed(4)}`);
            } catch (err) {
                const msg = err?.response?.data?.error || err.message;
                setStatus(msg, true);
            } finally {
                setBusy(false);
            }
        }

        async function onGameChange() {
            await loadModels(el.gameSelect.value);
        }

        function attachEvents() {
            el.startBtn.addEventListener('click', startGame);
            el.undoBtn.addEventListener('click', undoMove);
            el.passBtn.addEventListener('click', passMove);
            el.aiStepBtn.addEventListener('click', aiStep);
            el.analyzeBtn.addEventListener('click', analyze);
            el.gameSelect.addEventListener('change', onGameChange);
            el.modeSelect.addEventListener('change', () => {
                el.aiStepBtn.style.display = (el.modeSelect.value === 'ai_ai') ? 'block' : 'none';
            });
            el.showProb.addEventListener('change', renderBoard);
        }

        async function bootstrap() {
            attachEvents();
            await loadGames();
            await loadModels(el.gameSelect.value);
            await startGame();
        }

        bootstrap().catch(err => {
            setStatus(err.message || '初始化失败', true);
        });
    </script>
</body>
</html>
