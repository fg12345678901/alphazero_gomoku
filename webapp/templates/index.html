<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00d4ff">
    <title>AlphaZero 五子棋 - Quantum Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-cyan: #00d4ff;
            --primary-purple: #a855f7;
            --primary-pink: #ec4899;
            --dark-bg: #0a0e1a;
            --dark-surface: #141925;
            --dark-panel: #1e2436;
            --neon-glow: 0 0 20px rgba(0, 212, 255, 0.5);
            --text-primary: #e0e6ed;
            --text-secondary: #9ca3af;
            --border-color: rgba(0, 212, 255, 0.2);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f36 50%, #0a0e1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态背景网格 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 10s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 粒子背景效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary-cyan);
            border-radius: 50%;
            animation: float-up 15s linear infinite;
            box-shadow: 0 0 10px var(--primary-cyan);
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .main-title {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 212, 255, 0.5)); }
            50% { filter: brightness(1.2) drop-shadow(0 0 30px rgba(0, 212, 255, 0.8)); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 8px;
            font-weight: 300;
        }

        /* 控制面板 */
        .control-panel {
            background: linear-gradient(135deg, rgba(30, 36, 54, 0.9), rgba(20, 25, 37, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 30px rgba(0, 212, 255, 0.1),
                inset 0 0 20px rgba(0, 212, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink), var(--primary-cyan));
            border-radius: 20px;
            opacity: 0;
            z-index: -1;
            animation: border-glow 3s linear infinite;
        }

        @keyframes border-glow {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.5; }
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 未来风格输入控件 */
        .futuristic-select,
        .futuristic-input {
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--primary-cyan);
            padding: 10px 15px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .futuristic-select:hover,
        .futuristic-input:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.1);
        }

        .futuristic-select:focus,
        .futuristic-input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        /* 未来风格按钮 */
        .futuristic-btn {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .futuristic-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .futuristic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.5);
        }

        .futuristic-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .futuristic-btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), var(--primary-pink));
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), var(--primary-cyan));
        }

        /* 复选框样式 */
        .futuristic-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .futuristic-checkbox input[type="checkbox"] {
            appearance: none;
            width: 40px;
            height: 20px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .futuristic-checkbox input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .futuristic-checkbox input[type="checkbox"]:checked {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--primary-cyan);
        }

        .futuristic-checkbox input[type="checkbox"]:checked::before {
            transform: translateX(20px);
            background: var(--primary-cyan);
            box-shadow: 0 0 10px var(--primary-cyan);
        }

        /* 游戏区域 */
        .game-container {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 30px;
            align-items: start;
        }

        /* 棋盘容器 */
        .board-wrapper {
            background: linear-gradient(135deg, rgba(30, 36, 54, 0.9), rgba(20, 25, 37, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 40px rgba(0, 212, 255, 0.2),
                inset 0 0 30px rgba(0, 212, 255, 0.05);
            position: relative;
        }

        /* 棋盘样式 */
        .board {
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(10, 14, 26, 0.6);
            border-radius: 10px;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(0, 212, 255, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .board th {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(168, 85, 247, 0.1));
            color: var(--primary-cyan);
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            padding: 10px;
            font-size: 0.9rem;
        }

        .board td {
            width: 45px;
            height: 45px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            position: relative;
            cursor: pointer;
            background: rgba(20, 25, 37, 0.3);
            transition: all 0.3s ease;
        }

        .board td:hover {
            background: rgba(0, 212, 255, 0.15);
            box-shadow:
                0 0 20px rgba(0, 212, 255, 0.4),
                inset 0 0 10px rgba(0, 212, 255, 0.2);
            transform: scale(1.05);
            z-index: 10;
        }

        /* 棋子样式 */
        .board td.black::before,
        .board td.white::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            animation: piece-drop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .board td.black::before {
            background: radial-gradient(circle at 30% 30%, #444, #000);
            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.8),
                inset -3px -3px 10px rgba(255, 255, 255, 0.1),
                0 0 30px rgba(168, 85, 247, 0.4);
        }

        .board td.white::before {
            background: radial-gradient(circle at 30% 30%, #fff, #e0e0e0);
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.8),
                inset -3px -3px 10px rgba(0, 0, 0, 0.1),
                0 0 30px rgba(0, 212, 255, 0.4);
        }

        @keyframes piece-drop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(180deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2) rotate(90deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* 最后落子标记 */
        .board td.last-black::after,
        .board td.last-white::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-ring 1.5s ease-out infinite;
        }

        .board td.last-black::after {
            border: 2px solid var(--primary-purple);
            box-shadow: 0 0 20px var(--primary-purple);
        }

        .board td.last-white::after {
            border: 2px solid var(--primary-cyan);
            box-shadow: 0 0 20px var(--primary-cyan);
        }

        @keyframes pulse-ring {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0;
            }
        }

        /* 概率显示 */
        .prob {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 9px;
            color: var(--primary-cyan);
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.8);
            z-index: 5;
        }

        /* 步数显示 */
        .move-num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            z-index: 10;
            pointer-events: none;
        }

        td.black .move-num {
            color: var(--primary-cyan);
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.8);
        }

        td.white .move-num {
            color: var(--primary-purple);
            text-shadow: 0 0 5px rgba(168, 85, 247, 0.8);
        }

        /* 最佳落子位置 */
        .best-move {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.3), transparent) !important;
            animation: best-move-pulse 1s ease-in-out infinite;
        }

        @keyframes best-move-pulse {
            0%, 100% {
                box-shadow:
                    0 0 20px rgba(236, 72, 153, 0.5),
                    inset 0 0 20px rgba(236, 72, 153, 0.2);
            }
            50% {
                box-shadow:
                    0 0 30px rgba(236, 72, 153, 0.7),
                    inset 0 0 30px rgba(236, 72, 153, 0.3);
            }
        }

        /* 侧边面板 */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 状态显示 */
        .status-display {
            background: linear-gradient(135deg, rgba(30, 36, 54, 0.9), rgba(20, 25, 37, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
            text-align: center;
        }

        #status {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--primary-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        /* 记分板 */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .player-score {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), transparent);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .player-score.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(168, 85, 247, 0.1));
            border-color: var(--primary-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transform: scale(1.05);
        }

        .player-score .player-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .player-score .score {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-cyan);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* 数据面板 */
        .data-panel {
            background: linear-gradient(135deg, rgba(30, 36, 54, 0.9), rgba(20, 25, 37, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--primary-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        /* 图表容器 */
        .chart-container {
            background: rgba(10, 14, 26, 0.6);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        #valueChart {
            width: 100% !important;
            height: auto !important;
        }

        /* 历史记录 */
        .history-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(10, 14, 26, 0.6);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .history-container::-webkit-scrollbar {
            width: 8px;
        }

        .history-container::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 4px;
        }

        .history-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            border-radius: 4px;
        }

        #historyList {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        #historyList li {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: var(--primary-cyan);
            transition: all 0.3s ease;
        }

        #historyList li:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(168, 85, 247, 0.2));
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        /* 模态框 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(30, 36, 54, 0.95), rgba(20, 25, 37, 0.95));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            z-index: 1001;
            display: none;
            min-width: 350px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .modal h3 {
            font-family: 'Orbitron', monospace;
            color: var(--primary-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .game-container {
                grid-template-columns: 1fr;
            }

            .side-panel {
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .board td {
                width: 35px;
                height: 35px;
            }

            .board td.black::before,
            .board td.white::before {
                width: 28px;
                height: 28px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-cyan);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 胜利动画 */
        @keyframes victory-pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .victory-message {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: victory-pulse 1s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <div class="main-container">
        <!-- 标题 -->
        <div class="header">
            <h1 class="main-title">AlphaZero Gomoku</h1>
            <div class="subtitle">Quantum Intelligence Edition</div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label">游戏模式</label>
                    <select id="mode" class="futuristic-select">
                        <option value="human_ai">人机对战</option>
                        <option value="human_human">人人对战</option>
                        <option value="ai_ai">机机对战</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">执黑方</label>
                    <select id="human_color" class="futuristic-select">
                        <option value="1">玩家</option>
                        <option value="-1">AI</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">搜索深度</label>
                    <input id="sims" type="number" value="600" class="futuristic-input">
                </div>

                <div class="control-group">
                    <label class="control-label">AI 模型</label>
                    <select id="modelSelect" class="futuristic-select"></select>
                </div>

                <div class="control-group">
                    <label class="control-label">显示选项</label>
                    <label class="futuristic-checkbox">
                        <input type="checkbox" id="show_prob" checked>
                        <span>显示概率</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">操作</label>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="startGame()" class="futuristic-btn btn-success">开始</button>
                        <button onclick="undo()" class="futuristic-btn">悔棋</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">高级</label>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="openAnalyzeModal()" class="futuristic-btn">深度分析</button>
                        <button onclick="downloadBoard()" class="futuristic-btn">下载棋盘</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-container">
            <!-- 棋盘 -->
            <div class="board-wrapper">
                <div id="board"></div>
            </div>

            <!-- 侧边面板 -->
            <div class="side-panel">
                <!-- 状态显示 -->
                <div class="status-display">
                    <div class="scoreboard">
                        <div class="player-score" id="blackPlayer">
                            <div class="player-name">黑方</div>
                            <div class="score" id="blackCount">0</div>
                        </div>
                        <div class="player-score" id="whitePlayer">
                            <div class="player-name">白方</div>
                            <div class="score" id="whiteCount">0</div>
                        </div>
                    </div>
                    <div id="status"></div>
                    <div id="currentModel" style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 10px;"></div>
                </div>

                <!-- AI 评估 -->
                <div class="data-panel">
                    <h3 class="panel-title">AI 价值评估</h3>
                    <div id="values" style="color: var(--primary-cyan); font-family: 'Orbitron', monospace;"></div>
                    <div class="chart-container">
                        <canvas id="valueChart"></canvas>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="data-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 class="panel-title" style="margin: 0;">走子记录</h3>
                        <button onclick="copyHistory()" class="futuristic-btn" style="padding: 5px 15px; font-size: 0.8rem;">复制</button>
                    </div>
                    <div class="history-container">
                        <ol id="historyList"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 深度分析模态框 -->
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <div id="analyzeModal" class="modal">
        <h3>深度分析设置</h3>
        <div class="control-group">
            <label class="control-label">搜索次数</label>
            <input id="analyzeSims" type="number" min="1" class="futuristic-input">
        </div>
        <div class="modal-actions">
            <button id="analyzeCancel" class="futuristic-btn btn-danger">取消</button>
            <button id="analyzeConfirm" class="futuristic-btn btn-success">确定</button>
        </div>
    </div>

    <!-- 引入依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // 创建粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // 原有的JavaScript代码保持不变，只需要替换相关的DOM选择器和类名
        let size = 15; // 默认大小，实际从服务器获取
        let boardElem = document.getElementById('board');
        let valuesElem = document.getElementById('values');
        let policy = null;
        let currentBoard = null;
        let currentPlayer = 1;
        let awaitingAi = false;
        let gameOver = false;
        let moveHistory = [];
        let chart = null;
        let analysisPoints = [];

        // 胜利庆祝效果增强
        function celebrate(winner) {
            const colors = winner === 1 ? ['#a855f7', '#ec4899'] :
                            winner === -1 ? ['#00d4ff', '#3b82f6'] : ['#888', '#ccc'];

            // 多次发射彩带
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: colors,
                        gravity: 0.8,
                        scalar: 1.2
                    });
                }, i * 200);
            }

            // 添加全屏闪光效果
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: ${winner === 1 ? 'rgba(168, 85, 247, 0.3)' : 'rgba(0, 212, 255, 0.3)'};
                z-index: 9999;
                pointer-events: none;
                animation: flash 0.5s ease-out;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        // 以下JavaScript代码与原版基本相同，只是适配了新的样式类名
        // ... [继续原有的JavaScript逻辑，保持功能不变] ...

        function updateHistory() {
            const list = document.getElementById('historyList');
            if (!list) return;
            list.innerHTML = '';
            moveHistory.forEach((m, idx) => {
                const x = Math.floor(m / size) + 1;
                const y = m % size + 1;
                const li = document.createElement('li');
                li.textContent = `${idx+1}:(${x},${y})`;
                list.appendChild(li);
            });
        }

        function updateScoreboard() {
            if (!currentBoard) {
                document.getElementById('blackCount').textContent = '0';
                document.getElementById('whiteCount').textContent = '0';
            } else {
                let black = 0, white = 0;
                for (let i=0;i<size;i++) {
                    for (let j=0;j<size;j++) {
                        if (currentBoard[i][j] === 1) black++;
                        else if (currentBoard[i][j] === -1) white++;
                    }
                }
                document.getElementById('blackCount').textContent = black;
                document.getElementById('whiteCount').textContent = white;
            }
            document.getElementById('blackPlayer').classList.toggle('active', currentPlayer === 1);
            document.getElementById('whitePlayer').classList.toggle('active', currentPlayer === -1);
        }

        function copyHistory() {
            const text = moveHistory.map((m, idx) => {
                const x = Math.floor(m / size) + 1;
                const y = m % size + 1;
                return `${idx + 1}.(${x},${y})`;
            }).join(' ');
            navigator.clipboard.writeText(text);

            // 添加复制成功提示
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '已复制!';
            btn.style.background = 'linear-gradient(135deg, var(--success), var(--primary-cyan))';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }

        function downloadBoard() {
            html2canvas(document.getElementById('board')).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'alphazero-gomoku-board.png';
                link.click();
            });
        }

        function describeAdvantage(v) {
            const advantage = Math.abs(v);
            const level = advantage > 0.7 ? '绝对' : advantage > 0.4 ? '明显' : advantage > 0.2 ? '略有' : '';
            if (v > 0.1) return `⚫ 黑方${level}优势 (${(v*100).toFixed(1)}%)`;
            if (v < -0.1) return `⚪ 白方${level}优势 (${(Math.abs(v)*100).toFixed(1)}%)`;
            return '⚖️ 势均力敌';
        }

        function loadModels() {
            axios.get('/models').then(res => {
                const sel = document.getElementById('modelSelect');
                sel.innerHTML = '';
                res.data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (m === res.data.current) opt.selected = true;
                    sel.appendChild(opt);
                });
                document.getElementById('currentModel').textContent = res.data.current ? `当前模型: ${res.data.current}` : '';
            });
        }

        function initChart() {
            const ctx = document.getElementById('valueChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '胜率估计',
                        data: [],
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }, {
                        label: '搜索评估',
                        data: [],
                        borderColor: '#ec4899',
                        backgroundColor: '#fff',
                        pointBorderColor: '#ec4899',
                        pointBackgroundColor: '#fff',
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        borderWidth: 2,
                        showLine: false
                    }]
                },
                options: {
                    scales: {
                        y: {
                            min: -1,
                            max: 1,
                            grid: {
                                color: 'rgba(0, 212, 255, 0.1)',
                                borderColor: 'rgba(0, 212, 255, 0.3)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0, 212, 255, 0.1)',
                                borderColor: 'rgba(0, 212, 255, 0.3)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.getElementById('show_prob').addEventListener('change', () => {
            if(currentBoard) renderBoard(currentBoard, policy);
        });

        function renderBoard(board, probs) {
            currentBoard = board;
            let showProb = document.getElementById('show_prob').checked;
            let html = '<table class="board"><tr><th></th>';
            for (let j=0;j<size;j++) html += `<th>${j+1}</th>`;
            html += '</tr>';

            let best = {x:-1,y:-1,p:0};
            let maxProb = 0;
            if (probs) {
                for (let i=0;i<size;i++) {
                    for (let j=0;j<size;j++) {
                        if (board[i][j]===0) {
                            if (probs[i][j] > best.p) best = {x:i,y:j,p:probs[i][j]};
                            if (probs[i][j] > maxProb) maxProb = probs[i][j];
                        }
                    }
                }
            }

            const moveNumbers = {};
            let lastBlack = null, lastWhite = null;
            moveHistory.forEach((m, idx) => {
                const x = Math.floor(m / size);
                const y = m % size;
                moveNumbers[`${x},${y}`] = idx + 1;
                if (idx % 2 === 0) lastBlack = {x, y};
                else lastWhite = {x, y};
            });

            for (let i=0;i<size;i++) {
                html += `<tr><th>${i+1}</th>`;
                for (let j=0;j<size;j++) {
                    let v = board[i][j];
                    let probText = '';
                    let style = '';

                    if (v===0 && probs && showProb) {
                        let p = probs[i][j];
                        if (p > 0.01) {
                            probText = `<span class="prob">${(p*100).toFixed(1)}</span>`;
                            let ratio = maxProb ? p / maxProb : 0;
                            if (i===best.x && j===best.y) {
                                // Best move handled by class
                            } else if (p > 0) {
                                let opacity = 0.1 + (0.3 * ratio);
                                style = `background: rgba(0, 212, 255, ${opacity});`;
                            }
                        }
                    }

                    let cls = '';
                    if (v===1) cls += ' black';
                    if (v===-1) cls += ' white';
                    if (i===lastBlack?.x && j===lastBlack?.y) cls += ' last-black';
                    if (i===lastWhite?.x && j===lastWhite?.y) cls += ' last-white';
                    if (i===best.x && j===best.y && probs) cls += ' best-move';

                    let num = moveNumbers[`${i},${j}`];
                    let numHtml = num?`<span class="move-num">${num}</span>`:'';

                    html += `<td class="${cls.trim()}" style="${style}" data-x="${i}" data-y="${j}">${numHtml}${probText}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            boardElem.innerHTML = html;

            document.querySelectorAll('#board td').forEach(td => {
                td.addEventListener('click', () => {
                    move(td.dataset.x, td.dataset.y);
                });
            });

            updateScoreboard();
        }

        function updateChart(values) {
            if (!chart) return;
            chart.data.labels = values.map((_, i) => i);
            chart.data.datasets[0].data = values;
            chart.data.datasets[1].data = analysisPoints.filter(p => p.x < values.length);
            chart.update();
        }

        function startGame() {
            document.getElementById('status').innerHTML = '<div class="loading"></div> 初始化量子引擎...';
            const loadingTip = setTimeout(() => {
                document.getElementById('status').innerHTML = '<div class="loading"></div> 加载神经网络模型...';
            }, 1000);

            axios.post('/start', {
                mode: document.getElementById('mode').value,
                human_player: document.getElementById('human_color').value,
                mcts_sims: document.getElementById('sims').value,
                model: document.getElementById('modelSelect').value
            }).then(res => {
                clearTimeout(loadingTip);
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                gameOver = false;
                analysisPoints = [];
                document.getElementById('status').textContent = '';
                document.getElementById('currentModel').textContent = res.data.model ? `当前模型: ${res.data.model}` : '';
                renderBoard(res.data.board, policy);
                const last = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(last);
                updateChart(res.data.value_curve);
                updateHistory();
                updateScoreboard();
                if (document.getElementById('mode').value === 'ai_ai') {
                    setTimeout(autoPlay, 500);
                }
            });
        }

        function autoPlay() {
            if (gameOver || awaitingAi || document.getElementById('mode').value !== 'ai_ai') return;
            awaitingAi = true;
            axios.post('/ai_step').then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const v = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(v);
                updateChart(res.data.value_curve);
                awaitingAi = false;
                if (res.data.winner !== null) {
                    gameOver = true;
                    let msg = res.data.winner===1?'⚫ 黑方胜利!':(res.data.winner===-1?'⚪ 白方胜利!':'⚖️ 平局!');
                    document.getElementById('status').innerHTML = `<div class="victory-message">${msg}</div><button onclick="resetPage()" class="futuristic-btn btn-success" style="margin-top: 20px;">再来一局</button>`;
                    celebrate(res.data.winner);
                } else {
                    setTimeout(autoPlay, 500);
                }
            }).catch(err => {
                awaitingAi = false;
                if (err.response) alert(err.response.data.error);
            });
        }

        function openAnalyzeModal() {
            if (!currentBoard || awaitingAi) return;
            document.getElementById('analyzeSims').value = document.getElementById('sims').value;
            document.getElementById('analyzeModal').style.display = 'block';
            document.getElementById('modalBackdrop').style.display = 'block';
        }

        function closeAnalyzeModal() {
            document.getElementById('analyzeModal').style.display = 'none';
            document.getElementById('modalBackdrop').style.display = 'none';
        }

        function performAnalyze(sims) {
            document.getElementById('status').innerHTML = '<div class="loading"></div> 深度分析中...';
            axios.post('/analyze', {sims: sims}).then(res => {
                policy = res.data.policy;
                renderBoard(currentBoard, policy);
                const idx = chart.data.datasets[0].data.length - 1;
                analysisPoints.push({x: idx, y: res.data.value});
                chart.data.datasets[1].data = analysisPoints;
                chart.update();
                document.getElementById('status').textContent = '';
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
                document.getElementById('status').textContent = '';
            });
        }

        function move(x, y) {
            if (gameOver || awaitingAi || currentBoard[x][y] !== 0) return;
            currentBoard[x][y] = currentPlayer;
            currentPlayer = -currentPlayer;
            moveHistory.push(x*size + y);
            renderBoard(currentBoard, policy);
            updateHistory();
            updateScoreboard();
            awaitingAi = true;

            // 先获取先验概率用于展示
            axios.post('/prior', {x: x, y: y}).then(res => {
                if(awaitingAi) {
                    policy = res.data.policy;
                    renderBoard(currentBoard, policy);
                }
            });

            document.getElementById('status').innerHTML = '<div class="loading"></div> AI 量子计算中...';
            axios.post('/move', {x: x, y: y}).then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const lastMoveVal = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(lastMoveVal);
                updateChart(res.data.value_curve);
                document.getElementById('status').textContent = '';
                awaitingAi = false;
                if (res.data.winner !== null) {
                    gameOver = true;
                    let msg = res.data.winner===1?'⚫ 黑方胜利!':(res.data.winner===-1?'⚪ 白方胜利!':'⚖️ 平局!');
                    document.getElementById('status').innerHTML = `<div class="victory-message">${msg}</div><button onclick="resetPage()" class="futuristic-btn btn-success" style="margin-top: 20px;">再来一局</button>`;
                    celebrate(res.data.winner);
                }
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
                document.getElementById('status').textContent = '';
                awaitingAi = false;
            });
        }

        function undo() {
            axios.post('/undo').then(res => {
                policy = res.data.policy;
                currentBoard = res.data.board;
                currentPlayer = res.data.current_player;
                moveHistory = res.data.history || [];
                renderBoard(res.data.board, policy);
                updateHistory();
                updateScoreboard();
                const v = res.data.value_curve[res.data.value_curve.length-1];
                valuesElem.textContent = describeAdvantage(v);
                analysisPoints = analysisPoints.filter(p => p.x < res.data.value_curve.length);
                updateChart(res.data.value_curve);
                document.getElementById('status').textContent = '';
            }).catch(err => {
                if (err.response) alert(err.response.data.error);
            });
        }

        function resetPage() {
            location.reload();
        }

        // 初始化
        initChart();
        updateHistory();
        updateScoreboard();
        loadModels();

        document.getElementById('analyzeConfirm').addEventListener('click', () => {
            const sims = document.getElementById('analyzeSims').value;
            closeAnalyzeModal();
            if (sims) performAnalyze(sims);
        });
        document.getElementById('analyzeCancel').addEventListener('click', closeAnalyzeModal);

        // 添加键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAnalyzeModal();
            if (e.ctrlKey && e.key === 'z') undo();
            if (e.ctrlKey && e.key === 's') startGame();
        });
    </script>
</body>
</html>
