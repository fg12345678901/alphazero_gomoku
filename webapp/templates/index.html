<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8696b">
    <title>AlphaZero 五子棋</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
<h1>AlphaZero 五子棋</h1>
<div class="controls">
    <label>模式:
        <select id="mode">
            <option value="human_ai">人机对战</option>
            <option value="human_human">人人对战</option>
            <option value="ai_ai">机机对战</option>
        </select>
    </label>
    <label>执黑方:
        <select id="human_color">
            <option value="1">玩家</option>
            <option value="-1">AI</option>
        </select>
    </label>
    <label>搜索次数:
        <input id="sims" type="number" value="600" style="width:70px;">
    </label>
    <label><input type="checkbox" id="show_prob" checked>显示概率</label>
    <label>主题:
        <select id="theme">
            <option value="default">经典</option>
            <option value="dark">暗黑</option>
            <option value="neon">霓虹</option>
            <option value="ocean">海蓝</option>
        </select>
    </label>
    <button onclick="startGame()">开始</button>
    <button onclick="undo()">悔棋</button>
    <button onclick="openAnalyzeModal()">深度分析</button>
    <button onclick="downloadBoard()">下载棋盘</button>
</div>
<!-- 深度分析模态框 -->
<div id="modalBackdrop" class="modal-backdrop"></div>
<div id="analyzeModal" class="modal">
    <h3>深度分析</h3>
    <div>
        <label>搜索次数: <input id="analyzeSims" type="number" min="1" style="width:80px"></label>
    </div>
    <div class="modal-actions">
        <button id="analyzeCancel">取消</button>
        <button id="analyzeConfirm">确定</button>
    </div>
</div>
<div class="game-area">
    <div id="board"></div>
    <div class="scoreboard">
        <div class="player" id="blackPlayer">● <span id="blackCount">0</span></div>
        <div class="player" id="whitePlayer">○ <span id="whiteCount">0</span></div>
    </div>
    <div id="status"></div>
    <div class="side-panels">
        <div class="chart-container">
            <h3>AI 价值估计</h3>
            <p id="values"></p>
            <p class="note">折线图中 1 表示黑棋获胜，-1 表示白棋获胜</p>
            <canvas id="valueChart" width="400" height="200"></canvas>
        </div>
        <div class="history-container">
            <h3>走子记录 <button id="copyHistory" class="copy-btn" onclick="copyHistory()">复制</button></h3>
            <ol id="historyList"></ol>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
let size = {{ size }};
let boardElem = document.getElementById('board');
let valuesElem = document.getElementById('values');
let policy = null;
let currentBoard = null;
let currentPlayer = 1;
let awaitingAi = false;
let gameOver = false;
let moveHistory = [];
let chart = null;
let analysisPoints = [];

function celebrate(winner) {
    const colors = winner === 1 ? ['#000', '#ffc107'] :
                    winner === -1 ? ['#fff', '#2196f3'] : ['#888', '#ccc'];
    for (let i = 0; i < 3; i++) {
        confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.6 },
            colors: colors
        });
    }
}

function updateHistory() {
    const list = document.getElementById('historyList');
    if (!list) return;
    list.innerHTML = '';
    moveHistory.forEach((m, idx) => {
        const x = Math.floor(m / size) + 1;
        const y = m % size + 1;
        const li = document.createElement('li');
        li.textContent = `(${x},${y})`;
        list.appendChild(li);
    });
}

function updateScoreboard() {
    if (!currentBoard) {
        document.getElementById('blackCount').textContent = 0;
        document.getElementById('whiteCount').textContent = 0;
    } else {
        let black = 0, white = 0;
        for (let i=0;i<size;i++) {
            for (let j=0;j<size;j++) {
                if (currentBoard[i][j] === 1) black++;
                else if (currentBoard[i][j] === -1) white++;
            }
        }
        document.getElementById('blackCount').textContent = black;
        document.getElementById('whiteCount').textContent = white;
    }
    document.getElementById('blackPlayer').classList.toggle('active', currentPlayer === 1);
    document.getElementById('whitePlayer').classList.toggle('active', currentPlayer === -1);
}

function copyHistory() {
    const text = moveHistory.map((m, idx) => {
        const x = Math.floor(m / size) + 1;
        const y = m % size + 1;
        return `${idx + 1}.(${x},${y})`;
    }).join(' ');
    navigator.clipboard.writeText(text);
}

function downloadBoard() {
    html2canvas(document.getElementById('board')).then(canvas => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'board.png';
        link.click();
    });
}

function describeAdvantage(v) {
    if (v > 0) return '黑棋优势(●)';
    if (v < 0) return '白棋优势(○)';
    return '均势';
}

function initChart() {
    const ctx = document.getElementById('valueChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: '胜率估计',
                data: [],
                borderColor: '#42a5f5',
                backgroundColor: 'rgba(66,165,245,0.2)',
                fill: true,
                tension: 0.3
            }, {
                label: '搜索评估',
                data: [],
                borderColor: '#fdd835',
                backgroundColor: '#fff',
                pointBorderColor: '#fdd835',
                pointBackgroundColor: '#fff',
                pointRadius: 5,
                pointHoverRadius: 5,
                borderWidth: 2,
                showLine: false
            }]
        },
        options: {
            scales: { y: { min: -1, max: 1 } },
            plugins: { legend: { display: false } }
        }
    });
}
document.getElementById('show_prob').addEventListener('change', () => {
    if(currentBoard) renderBoard(currentBoard, policy);
});

// 恢复主题样式
const savedTheme = localStorage.getItem('theme') || 'default';
if (savedTheme === 'neon') {
    document.body.classList.add('neon');
    document.getElementById('theme').value = 'neon';
} else if (savedTheme === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('theme').value = 'dark';
} else if (savedTheme === 'ocean') {
    document.body.classList.add('ocean');
    document.getElementById('theme').value = 'ocean';
}
document.getElementById('theme').addEventListener('change', (e) => {
    document.body.classList.remove('neon', 'dark', 'ocean');
    if (e.target.value === 'neon') {
        document.body.classList.add('neon');
    } else if (e.target.value === 'dark') {
        document.body.classList.add('dark');
    } else if (e.target.value === 'ocean') {
        document.body.classList.add('ocean');
    }
    localStorage.setItem('theme', e.target.value);
});

function addHoverEffects() {
    document.querySelectorAll('#board td').forEach(td => {
        td.addEventListener('mouseenter', () => {
            const x = td.dataset.x;
            const y = td.dataset.y;
            document.querySelectorAll(`#board td[data-x='${x}']`).forEach(el => el.classList.add('hover-row'));
            document.querySelectorAll(`#board td[data-y='${y}']`).forEach(el => el.classList.add('hover-col'));
        });
        td.addEventListener('mouseleave', () => {
            document.querySelectorAll('#board td').forEach(el => el.classList.remove('hover-row', 'hover-col'));
        });
    });
}

function updateChart(values) {
    if (!chart) return;
    chart.data.labels = values.map((_, i) => i);
    chart.data.datasets[0].data = values;
    chart.data.datasets[1].data = analysisPoints.filter(p => p.x < values.length);
    chart.update();
}

function renderBoard(board, probs) {
    currentBoard = board;
    let showProb = document.getElementById('show_prob').checked;
    let html = '<table class="board"><tr><th></th>';
    for (let j=0;j<size;j++) html += `<th>${j+1}</th>`;
    html += '</tr>';

    let best = {x:-1,y:-1,p:0};
    let maxProb = 0;
    if (probs) {
        for (let i=0;i<size;i++) {
            for (let j=0;j<size;j++) {
                if (board[i][j]===0) {
                    if (probs[i][j] > best.p) best = {x:i,y:j,p:probs[i][j]};
                    if (probs[i][j] > maxProb) maxProb = probs[i][j];
                }
            }
        }
    }

    const moveNumbers = {};
    let lastBlack = null, lastWhite = null;
    moveHistory.forEach((m, idx) => {
        const x = Math.floor(m / size);
        const y = m % size;
        moveNumbers[`${x},${y}`] = idx + 1;
        if (idx % 2 === 0) lastBlack = {x, y};
        else lastWhite = {x, y};
    });

    for (let i=0;i<size;i++) {
        html += `<tr><th>${i+1}</th>`;
        for (let j=0;j<size;j++) {
            let v = board[i][j];
            let text = v===1?'●':(v===-1?'○':'');
            let probText = '';
            let style = '';
            if (v===0 && probs && showProb) {
                let p = probs[i][j];
                probText = `<span class="prob">${(p*100).toFixed(1)}</span>`;
                let ratio = maxProb ? p / maxProb : 0;
                if (i===best.x && j===best.y) {
                    style = 'background-color:#ff8a65;';
                } else if (p > 0) {
                    let light = 90 - 50 * ratio;
                    style = `background-color:hsl(40,100%,${light}%)`;
                }
            } else if (i===best.x && j===best.y && probs) {
                style = 'background-color:#ff8a65;';
            }

            let cls = '';
            if (v===1) cls += ' black';
            if (v===-1) cls += ' white';
            if (i===lastBlack?.x && j===lastBlack?.y) cls += ' last-black';
            if (i===lastWhite?.x && j===lastWhite?.y) cls += ' last-white';
            let num = moveNumbers[`${i},${j}`];
            let numHtml = num?`<span class="move-num">${num}</span>`:'';

            html += `<td class="${(i===best.x && j===best.y && probs)?'best-move ':''}${cls.trim()}" style="${style}" data-x="${i}" data-y="${j}">${text}${numHtml}${probText}</td>`;
        }
        html += '</tr>';
    }
    html += '</table>';
    boardElem.innerHTML = html;
    document.querySelectorAll('#board td').forEach(td => {
        td.addEventListener('click', () => {
            move(td.dataset.x, td.dataset.y);
        });
    });
    addHoverEffects();
    updateScoreboard();
}

function startGame() {
    document.getElementById('status').textContent = '加载中...';
    axios.post('/start', {
        mode: document.getElementById('mode').value,
        human_player: document.getElementById('human_color').value,
        mcts_sims: document.getElementById('sims').value
    }).then(res => {
        policy = res.data.policy;
        currentBoard = res.data.board;
        currentPlayer = res.data.current_player;
        moveHistory = res.data.history || [];
        gameOver = false;
        analysisPoints = [];
        document.getElementById('status').textContent = '';
        renderBoard(res.data.board, policy);
        const last = res.data.value_curve[res.data.value_curve.length-1];
        valuesElem.textContent = describeAdvantage(last);
        updateChart(res.data.value_curve);
        updateHistory();
        updateScoreboard();
        if (document.getElementById('mode').value === 'ai_ai') {
            setTimeout(autoPlay, 500);
        }
    });
}

function autoPlay() {
    if (gameOver || awaitingAi || document.getElementById('mode').value !== 'ai_ai') return;
    awaitingAi = true;
    axios.post('/ai_step').then(res => {
        policy = res.data.policy;
        currentBoard = res.data.board;
        currentPlayer = res.data.current_player;
        moveHistory = res.data.history || [];
        renderBoard(res.data.board, policy);
        updateHistory();
        updateScoreboard();
        const v = res.data.value_curve[res.data.value_curve.length-1];
        valuesElem.textContent = describeAdvantage(v);
        updateChart(res.data.value_curve);
        awaitingAi = false;
        if (res.data.winner !== null) {
            gameOver = true;
            let msg = res.data.winner===1?'黑胜':(res.data.winner===-1?'白胜':'平局');
            document.getElementById('status').innerHTML = msg + ' <button onclick="resetPage()">再来一局</button>';
            celebrate(res.data.winner);
        } else {
            setTimeout(autoPlay, 500);
        }
    }).catch(err => {
        awaitingAi = false;
        if (err.response) alert(err.response.data.error);
    });
}

function openAnalyzeModal() {
    if (!currentBoard || awaitingAi) return;
    document.getElementById('analyzeSims').value = document.getElementById('sims').value;
    document.getElementById('analyzeModal').style.display = 'block';
    document.getElementById('modalBackdrop').style.display = 'block';
}

function closeAnalyzeModal() {
    document.getElementById('analyzeModal').style.display = 'none';
    document.getElementById('modalBackdrop').style.display = 'none';
}

function performAnalyze(sims) {
    document.getElementById('status').textContent = '分析中...';
    axios.post('/analyze', {sims: sims}).then(res => {
        policy = res.data.policy;
        renderBoard(currentBoard, policy);
        const idx = chart.data.datasets[0].data.length - 1;
        analysisPoints.push({x: idx, y: res.data.value});
        chart.data.datasets[1].data = analysisPoints;
        chart.update();
        document.getElementById('status').textContent = '';
    }).catch(err => {
        if (err.response) alert(err.response.data.error);
        document.getElementById('status').textContent = '';
    });
}
function move(x, y) {
    if (gameOver || awaitingAi || currentBoard[x][y] !== 0) return;
    currentBoard[x][y] = currentPlayer;
    currentPlayer = -currentPlayer;
    moveHistory.push(x*size + y);
    renderBoard(currentBoard, policy);
    updateHistory();
    updateScoreboard();
    awaitingAi = true;
    // 先获取先验概率用于展示
    axios.post('/prior', {x: x, y: y}).then(res => {
        if(awaitingAi) {
            policy = res.data.policy;
            renderBoard(currentBoard, policy);
        }
    });
    document.getElementById('status').textContent = 'AI 思考中...';
    axios.post('/move', {x: x, y: y}).then(res => {
        policy = res.data.policy;
        currentBoard = res.data.board;
        currentPlayer = res.data.current_player;
        moveHistory = res.data.history || [];
        renderBoard(res.data.board, policy);
        updateHistory();
        updateScoreboard();
        const lastMoveVal = res.data.value_curve[res.data.value_curve.length-1];
        valuesElem.textContent = describeAdvantage(lastMoveVal);
        updateChart(res.data.value_curve);
        document.getElementById('status').textContent = '';
        awaitingAi = false;
        if (res.data.winner !== null) {
            gameOver = true;
            let msg = res.data.winner===1?'黑胜':(res.data.winner===-1?'白胜':'平局');
            document.getElementById('status').innerHTML = msg + ' <button onclick="resetPage()">再来一局</button>';
            celebrate(res.data.winner);
        }
    }).catch(err => {
        if (err.response) alert(err.response.data.error);
        document.getElementById('status').textContent = '';
        awaitingAi = false;
    });
}

function undo() {
    axios.post('/undo').then(res => {
        policy = res.data.policy;
        currentBoard = res.data.board;
        currentPlayer = res.data.current_player;
        moveHistory = res.data.history || [];
        renderBoard(res.data.board, policy);
        updateHistory();
        updateScoreboard();
        const v = res.data.value_curve[res.data.value_curve.length-1];
        valuesElem.textContent = describeAdvantage(v);
        analysisPoints = analysisPoints.filter(p => p.x < res.data.value_curve.length);
        updateChart(res.data.value_curve);
        document.getElementById('status').textContent = '';
    }).catch(err => { if (err.response) alert(err.response.data.error); });
}

function resetPage() {
    location.reload();
}

initChart();
updateHistory();
updateScoreboard();
document.getElementById('analyzeConfirm').addEventListener('click', () => {
    const sims = document.getElementById('analyzeSims').value;
    closeAnalyzeModal();
    if (sims) performAnalyze(sims);
});
document.getElementById('analyzeCancel').addEventListener('click', closeAnalyzeModal);
</script>
</div>
</body>
</html>
